server:
  port: 8888

spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: property-service
              uri: lb://PROPERTY-SERVICE
              predicates:
                - Path=/api/v1/rooms/**
            - id: contracts-service
              uri: lb://CONTRACT-SERVICE
              predicates:
                - Path=/api/v1/contracts/**
            - id: tenant-service
              uri: lb://TENANT-SERVICE
              predicates:
                  - Path=/api/v1/tenants/**
            - id: billing-service
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/api/v1/invoices/**,/api/v1/utilities/**
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/v1/payments/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
