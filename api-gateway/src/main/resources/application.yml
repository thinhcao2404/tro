server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/auth/**
            - id: property-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/rooms/**
            - id: contracts-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/contracts/**
            - id: tenant-service
              uri: http://localhost:8082
              predicates:
                  - Path=/api/v1/tenants/**

