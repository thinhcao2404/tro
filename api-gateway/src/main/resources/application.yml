server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: property-service
              uri: lb://PROPERTY-SERVICE
              predicates:
                - Path=/api/v1/rooms/**
            - id: contracts-service
              uri: lb://CONTRACT-SERVICE
              predicates:
                - Path=/api/v1/contracts/**
            - id: tenant-service
              uri: lb://TENANT-SERVICE
              predicates:
                  - Path=/api/v1/tenants/**
            - id: billing-service
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/api/v1/invoices/**,/api/v1/utilities/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

